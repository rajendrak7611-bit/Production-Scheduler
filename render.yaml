databases:
  - name: grs-db
    databaseName: grs_production
    user: grs_admin
    plan: free

services:
  - type: web
    name: grs-production-management
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: grs-db
          property: connectionString
